name: curie-document-chat

# Model settings for the worker, which calls the models.
# Defaults reach LM Studio on the host; set the variables in `.env` for another provider (see `.env.example`).
x-model-env: &model-env
  MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:1234/v1}
  MODEL_API_KEY: ${MODEL_API_KEY:-not-needed}
  MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-240000}
  CHAT_MODEL: ${CHAT_MODEL:-google/gemma-4-26b-a4b-qat}
  CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-1700}
  CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-}
  CHAT_TOP_P: ${CHAT_TOP_P:-}
  CHAT_TOP_K: ${CHAT_TOP_K:-}
  CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
  EMBEDDING_DOC_PREFIX: '${EMBEDDING_DOC_PREFIX-search_document: }'
  EMBEDDING_QUERY_PREFIX: '${EMBEDDING_QUERY_PREFIX-search_query: }'
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
  PASSAGE_TOKEN_BUDGET: ${PASSAGE_TOKEN_BUDGET:-4000}
  CHAT_RETRY_REASONING_EFFORT: ${CHAT_RETRY_REASONING_EFFORT-none}
  CHAT_RETRY_TEMPERATURE: ${CHAT_RETRY_TEMPERATURE:-0}
  CHAT_RETRY_TIMEOUT_MS: ${CHAT_RETRY_TIMEOUT_MS:-120000}
  REWRITE_TIMEOUT_MS: ${REWRITE_TIMEOUT_MS:-60000}
  MODEL_STARTUP_CHECK: ${MODEL_STARTUP_CHECK:-true}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: curie
      # Local-only password, never published outside the Compose network. It is placed raw into connection URLs,
      # so it must use URL-safe characters.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curie-local}
      POSTGRES_DB: curie
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP on purpose: on first start the entrypoint runs a temporary server on the Unix socket only, and a
      # socket check would report healthy before the real server accepts connections.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U curie -d curie']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # The entrypoint fixes data-directory ownership and switches to the postgres user on every start; these are
    # the only capabilities that needs. FOWNER just lets its chmod succeed instead of logging an ignored error.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    # One process per connection plus background workers; the default max_connections is 100.
    pids_limit: 200
    networks: [backend]

  redis:
    image: redis:7.4.12-alpine
    # BullMQ needs noeviction. maxmemory sits below the container limit, so a full Redis refuses writes and is less
    # likely to be killed (forks and buffers can still go over it).
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '192mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # The entrypoint fixes data ownership and switches to the redis user on every start. DAC_OVERRIDE lets it read
    # the data folder on a restart, when that folder already belongs to redis (checked: restarts fail without it).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runtime
    environment:
      # Only what the API needs to check a document's embedding model; it never calls the model.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      HOST: 0.0.0.0
      DATABASE_URL: postgres://curie:${POSTGRES_PASSWORD:-curie-local}@postgres:5432/curie
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    # A small init as PID 1 forwards stop signals to Node at any moment, including during start-up.
    init: true
    # Longer than the 15 s statement timeout, so a shutdown can always wait for the statement in flight. Docker's
    # default here was about 3 s.
    stop_grace_period: 20s
    user: node
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 200
    networks: [backend]

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runtime
    command: ['node', 'dist/worker.js']
    environment:
      <<: *model-env
      DATABASE_URL: postgres://curie:${POSTGRES_PASSWORD:-curie-local}@postgres:5432/curie
      REDIS_URL: redis://redis:6379
    # Lets the worker reach a model server on the host. Docker Desktop provides this name; on Linux this line does.
    extra_hosts: ['host.docker.internal:host-gateway']
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    init: true
    # On a stop the worker cancels the model call in flight and puts its job back; 20 s bounds the whole shutdown.
    stop_grace_period: 30s
    user: node
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 200
    networks: [backend]

  # Runs only through `docker compose run --rm test`. Uses its own database and Redis index, so tests never touch
  # the data of a running stack.
  test:
    profiles: [test]
    # Rebuild on every run, so the plain `docker compose run --rm test` never tests stale code.
    pull_policy: build
    build:
      context: .
      dockerfile: server/Dockerfile
      target: test
    environment:
      DATABASE_URL: postgres://curie:${POSTGRES_PASSWORD:-curie-local}@postgres:5432/curie_test
      REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend]

networks:
  backend: {}

volumes:
  pgdata: {}
  redisdata: {}
