# Runs as an unprivileged user on a read-only filesystem: everything nginx writes goes to /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Docker's own name server, asked again every 10 s, so a restarted API is found at its new address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    # PDFs go up to 5 MB; the multipart wrapping needs a little more.
    client_max_body_size 6m;

    # The app itself. Nothing on the page is inline, so the policy allows only files from this origin.
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Cross-Origin-Resource-Policy same-origin always;
      # Checked with the server on each use, so a rebuilt app never loads an old index.html that names files
      # the new build no longer has.
      add_header Cache-Control no-cache always;
    }

    # The API, with the browser's Host passed on for its host check. Its own security headers come with it.
    location /api/ {
      set $api http://api:3000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api;
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # An answer's event stream: passed on as it is written, never buffered or compressed, and kept open while
    # the answer takes (heartbeats arrive every 15 s).
    location ~ ^/api/messages/[^/]+/events$ {
      set $api http://api:3000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api;
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 1h;
    }
  }
}
